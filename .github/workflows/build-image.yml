name: Build container image

on:
  workflow_dispatch:
  push:
    branches:
      - 'sinoru/main'
      - 'sinoru/develop'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+\+sinoru*'
    paths:
      - .github/workflows/build-image.yml
      - Dockerfile
      - src/**.c
  pull_request:
    paths:
      - .github/workflows/build-image.yml
      - Dockerfile
      - src/**.c

permissions:
  contents: read

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: |
        linux/amd64
        linux/arm64
      cache: true
      cache-mode: max
      cache-scope: ${{ github.ref_name }}
      set-meta-labels: true
      # docker/metadata-action lowercases the image name (ghcr.io requires lowercase repository names)
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: |
        latest=auto
      meta-tags: |
        type=edge,branch=sinoru/main
        type=edge,branch=sinoru/develop
        type=semver,pattern={{raw}}
        type=ref,event=pr
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  verify:
    if: github.event_name != 'pull_request'
    needs:
      - build
    uses: docker/github-builder/.github/workflows/verify.yml@v1
    permissions:
      contents: read
      packages: read
    with:
      builder-outputs: ${{ toJSON(needs.build.outputs) }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
